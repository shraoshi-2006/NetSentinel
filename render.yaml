databases:
  - name: netsentinel-db
    databaseName: netsentinel
    user: postgres
    plan: free

services:
  # Backend API
  - type: web
    name: netsentinel-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: netsentinel-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: https://netsentinel-frontend.onrender.com,http://localhost:3000
      - key: ENVIRONMENT
        value: production

  # Frontend
  - type: web
    name: netsentinel-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://netsentinel-backend.onrender.com/api/v1
